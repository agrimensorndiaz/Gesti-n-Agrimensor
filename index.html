<!doctype html><html lang="es" translate="no"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="google" content="notranslate"><meta name="theme-color" content="#c2410c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Agrimensor"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Gestión Agrimensor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: barra superior compacta + contenido en una columna + navegación inferior de 3 pestañas; la ficha y la configuración se abren en una hoja encima. */
:root{
  --bg:#f2f4f3; --surface:#ffffff; --sunken:#e9edec; --ink:#16212a; --muted:#5b6971; --line:#d9e0de;
  --accent:#c2410c; --accent-ink:#ffffff; --accent-soft:#fdeadc;
  --warn:#a85a0c; --warn-soft:#fbefdf; --ok:#2d6a43; --ok-soft:#e2f1e6; --danger:#a53030; --danger-soft:#f8e3e1;
  --s0b:#fbe1ee; --s0f:#a3195b; --s1b:#fbf0c2; --s1f:#735600; --s2b:#d9f0f9; --s2f:#0b6488; --s3b:#e2e9fb; --s3f:#2550a8; --s4b:#eee5f8; --s4f:#6b3fa0; --s5b:#fbe0dc; --s5f:#b0281f; --s6b:#dcf1e0; --s6f:#286c35; --s7b:#d6f0eb; --s7f:#0e6a61; --s8b:#e8ebef; --s8f:#4c5662;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161a; --surface:#182127; --sunken:#121a1f; --ink:#e4eaed; --muted:#93a2aa; --line:#29353c;
  --accent:#fb923c; --accent-ink:#2a1405; --accent-soft:#3a2312;
  --warn:#eda253; --warn-soft:#33260f; --ok:#7cc492; --ok-soft:#16291d; --danger:#ef8a80; --danger-soft:#361b1a;
  --s0b:#3a1527; --s0f:#f59ac4; --s1b:#332a0b; --s1f:#e8cc6a; --s2b:#0f2f3c; --s2f:#84cfee; --s3b:#1b2741; --s3f:#a3bcf6; --s4b:#2b2140; --s4f:#caa9f0; --s5b:#3d1c18; --s5f:#f39a90; --s6b:#16301b; --s6f:#8fd39b; --s7b:#10302b; --s7f:#82d6c9; --s8b:#242b33; --s8f:#b4bfca;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161a; --surface:#182127; --sunken:#121a1f; --ink:#e4eaed; --muted:#93a2aa; --line:#29353c;
  --accent:#fb923c; --accent-ink:#2a1405; --accent-soft:#3a2312;
  --warn:#eda253; --warn-soft:#33260f; --ok:#7cc492; --ok-soft:#16291d; --danger:#ef8a80; --danger-soft:#361b1a;
  --s0b:#3a1527; --s0f:#f59ac4; --s1b:#332a0b; --s1f:#e8cc6a; --s2b:#0f2f3c; --s2f:#84cfee; --s3b:#1b2741; --s3f:#a3bcf6; --s4b:#2b2140; --s4f:#caa9f0; --s5b:#3d1c18; --s5f:#f39a90; --s6b:#16301b; --s6f:#8fd39b; --s7b:#10302b; --s7f:#82d6c9; --s8b:#242b33; --s8f:#b4bfca;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--f-body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);border-top:4px solid var(--accent)}
.top-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
@media (max-width:430px){.new-btn{width:44px;padding:0;font-size:24px;line-height:1}.new-btn .nl{display:none}.brand h1{font-size:19px}}
.logo{width:40px;height:40px;flex:none;border-radius:10px}
.brand{flex:1;min-width:0;display:flex;flex-direction:column;gap:0}
.brand h1{color:var(--accent);font-size:20px;font-weight:700;letter-spacing:.01em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.save-state{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.save-state.local{color:var(--warn)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.new-btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;height:40px;padding:0 16px;font-weight:600;flex:none}

main{max-width:760px;margin:0 auto;padding:14px 16px calc(92px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:18px}

/* navegación inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{border:0;background:none;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:13px;font-weight:600}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab[aria-current="page"]{color:var(--accent)}

/* bloques */
.label{font-family:var(--f-display);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.label .count{letter-spacing:0;text-transform:none;font-family:var(--f-body);font-weight:500}
.block{display:flex;flex-direction:column;gap:8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.active-total{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 14px;text-align:left}
.active-total span{flex:1;font-family:var(--f-display);font-weight:600;font-size:18px}
.active-total b{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1}
.stats.lead{grid-template-columns:minmax(0,.7fr) minmax(0,1fr) minmax(0,1fr)}
.stat{padding:10px 10px;min-width:0;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat small{display:block;font-size:12px;color:var(--muted)}
.stat b{display:block;font-family:var(--f-display);font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b.warn{color:var(--warn)}

.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--line);min-height:52px}
.row:first-child{border-top:0}
.row.tap{cursor:pointer}
.row.tap:active{background:var(--sunken)}
.row .main{flex:1;min-width:0}
.row .t1{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t2{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:1px}
.row .amt{font-family:var(--f-display);font-weight:600;font-size:17px;text-align:right;white-space:nowrap}
.row .amt small{display:block;font-family:var(--f-body);font-size:11px;font-weight:500;color:var(--muted)}
.row.done .t1{text-decoration:line-through;color:var(--muted)}
.chev{color:var(--muted);flex:none}
.row.total-row{background:var(--sunken)}
.day{width:44px;flex:none;text-align:center;border-radius:8px;background:var(--sunken);padding:4px 0;line-height:1.1}
.day span{display:block;font-size:11px;font-weight:600;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}
.day b{font-family:var(--f-display);font-size:20px;font-weight:700}
.day.today{background:var(--accent);color:var(--accent-ink)}.day.today span{color:var(--accent-ink)}
.day.late-day{background:var(--warn-soft);color:var(--warn)}.day.late-day span{color:var(--warn)}
.sub-h{font-size:13px;font-weight:600;color:var(--muted);margin-top:2px}.sub-h.late{color:var(--warn)}
.nodate{display:flex;align-items:center;gap:6px;justify-content:space-between;width:100%;border:1px dashed var(--line);background:none;border-radius:var(--r);padding:10px 12px;font-size:14px;font-weight:600;color:var(--ink);text-align:left}
.meas{color:var(--accent);font-weight:600}
.cal-st{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.cal-st .link{padding:0;font-size:13px}
.cal-st.ok{color:var(--ok);font-weight:600}.cal-st.ok::before{content:"✓"}
.cal-st.err{color:var(--warn)}
.cal-line{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.cal-line .t2,.panel > .t2{font-size:13px;color:var(--muted);margin-top:2px}
.switch{flex:none;width:48px;height:28px;border-radius:999px;border:0;background:var(--line);position:relative;padding:0}
.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch[aria-checked="true"]{background:var(--ok)}.switch[aria-checked="true"] i{left:23px}
.meas-box{padding:12px;display:flex;flex-direction:column;gap:10px}
.meas-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.meas-top small{display:block;font-size:12px;color:var(--muted)}.meas-top b{font-family:var(--f-display);font-size:19px;font-weight:600}
.date-in{border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--surface);color:var(--ink);flex:none;max-width:160px}
.empty{padding:18px 14px;color:var(--muted);text-align:center;font-size:14px}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.st0{background:var(--s0b);color:var(--s0f)}.st1{background:var(--s1b);color:var(--s1f)}.st2{background:var(--s2b);color:var(--s2f)}.st3{background:var(--s3b);color:var(--s3f)}.st4{background:var(--s4b);color:var(--s4f)}.st5{background:var(--s5b);color:var(--s5f)}.st6{background:var(--s6b);color:var(--s6f)}.st7{background:var(--s7b);color:var(--s7f)}.st8{background:var(--s8b);color:var(--s8f)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.dot.st0{background:var(--s0f)}.dot.st1{background:var(--s1f)}.dot.st2{background:var(--s2f)}.dot.st3{background:var(--s3f)}.dot.st4{background:var(--s4f)}.dot.st5{background:var(--s5f)}.dot.st6{background:var(--s6f)}.dot.st7{background:var(--s7f)}.dot.st8{background:var(--s8f)}
.strip0{box-shadow:inset 5px 0 0 var(--s0f)}.strip1{box-shadow:inset 5px 0 0 var(--s1f)}.strip2{box-shadow:inset 5px 0 0 var(--s2f)}.strip3{box-shadow:inset 5px 0 0 var(--s3f)}.strip4{box-shadow:inset 5px 0 0 var(--s4f)}.strip5{box-shadow:inset 5px 0 0 var(--s5f)}.strip6{box-shadow:inset 5px 0 0 var(--s6f)}.strip7{box-shadow:inset 5px 0 0 var(--s7f)}.strip8{box-shadow:inset 5px 0 0 var(--s8f)}
.quote{border:2px solid var(--s0f);border-radius:var(--r);background:var(--s0b);padding:12px;display:flex;flex-direction:column;gap:10px}
.quote-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.quote-h b{font-family:var(--f-display);font-size:20px;font-weight:700;color:var(--s0f)}
.quote-h small{font-size:13px;color:var(--ink)}
.quote .rows{border-color:transparent}
.qrow{display:flex;flex-direction:column;gap:8px;padding:11px 12px;border-top:1px solid var(--line)}
.qrow:first-child{border-top:0}
.qrow .qtop{display:flex;align-items:center;gap:8px;cursor:pointer}
.qrow .qtop .main{flex:1;min-width:0}
.qrow .t1{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow .t2{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qform{display:flex;gap:8px}
.qform input,.qform select{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px}
.qform .btn{flex:none;padding:9px 14px}
.qadd{display:flex;flex-direction:column;gap:8px;padding:11px 12px;border-top:1px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.hi{color:var(--danger);font-weight:600}
.late{color:var(--warn);font-weight:600}

/* etapas en inicio */
.stages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.stage-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;text-align:left;min-width:0}
.stage-btn span.n{margin-left:auto;font-family:var(--f-display);font-weight:600;font-size:18px}
.stage-btn span.nm{min-width:0;font-size:14px;font-weight:500;line-height:1.15}
.stage-btn.zero{opacity:.55}

/* casillas */
.check{appearance:none;-webkit-appearance:none;width:24px;height:24px;border:2px solid var(--muted);border-radius:6px;flex:none;display:grid;place-items:center;margin:0;background:var(--surface)}
.check:checked{background:var(--ok);border-color:var(--ok)}
.check:checked::after{content:"";width:6px;height:11px;border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}

/* búsqueda y filtros */
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:11px 12px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fbtn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500}
.fbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.group-h{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:600;font-size:15px;margin-top:4px}
.group-h .count{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted)}

/* tabla de plata */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:10px 12px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
th{border-top:0;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-family:var(--f-display)}
td.r,th.r{text-align:right}
td.cli{white-space:normal;min-width:120px}
td.cli small{display:block;color:var(--muted);font-size:12px}
tr.tap{cursor:pointer}
tfoot td{font-weight:600;background:var(--sunken)}

/* botones */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:11px 14px;font-weight:600;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.armed{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn.full{width:100%}
.btn.sm{padding:6px 10px;font-size:14px;border-radius:8px}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 0}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1}

/* hoja */
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(10,16,20,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94%;overflow-y:auto;border-radius:16px 16px 0 0;padding:0 16px calc(24px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:16px;max-height:90%}}
.sheet-head{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:flex-start;gap:10px;padding:14px 0 10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.sheet-head .main{flex:1;min-width:0}
.sheet-head h2{font-size:24px;font-weight:700;line-height:1.15}
.sheet-head .sub{font-size:14px;color:var(--muted);margin-top:2px}
.sheet-body{display:flex;flex-direction:column;gap:18px}

/* ficha */
.steps{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.steps i{height:6px;border-radius:3px;background:var(--line)}
.steps i.done{background:var(--muted)}
.steps i.cur{background:var(--ink)}
.stage-line{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.stage-line .chip{font-size:14px;padding:4px 10px}
.stage-line small{color:var(--muted);font-size:13px}
.money3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.money3 > div{padding:10px 12px;border-left:1px solid var(--line);min-width:0}
.money3 > div:first-child{border-left:0}
.money3 small{display:block;font-size:12px;color:var(--muted)}
.money3 b{font-family:var(--f-display);font-size:18px;font-weight:600;white-space:nowrap;display:block;overflow:hidden;text-overflow:ellipsis}
.note{border-radius:var(--r);padding:10px 12px;font-size:14px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note.info{background:var(--accent-soft);color:var(--ink)}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;font-size:15px}
.more{display:none;flex-direction:column;gap:8px}
.more.open{display:flex}
.add-line{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--line)}
.add-line input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px}
.rows .add-line:first-child{border-top:0}
.amt-btn{border:0;background:none;padding:4px 0;font-family:var(--f-display);font-weight:600;font-size:17px;white-space:nowrap}
.small-act{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 9px;font-size:13px;font-weight:600;flex:none}

/* formularios */
.form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:11px 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--danger);font-size:14px;font-weight:600}

/* configuración */
.type-card{padding:12px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.type-card:first-child{border-top:0}
.type-name{display:flex;gap:8px;align-items:center}
.type-name input{flex:1;min-width:0;border:1px solid transparent;background:transparent;font-weight:600;padding:6px 8px;border-radius:8px;font-family:var(--f-display);font-size:17px}
.type-name input:focus{border-color:var(--line);background:var(--bg)}
.tog{display:flex;flex-wrap:wrap;gap:6px}
.tog button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 10px;font-size:13px;color:var(--muted)}
.tog button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.exp-line{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line)}
.exp-line:first-child{border-top:0}
.exp-line .nm{flex:1;min-width:0;font-weight:500}
.exp-line input{width:130px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;text-align:right}

/* contacto, para hacer, cobrado por mes */
.contact{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.contact a{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--ink);text-decoration:none}
.contact a.wa{border-color:var(--ok);color:var(--ok)}
.contact svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9}
a.btn{text-decoration:none;color:inherit}
a.btn.wa{border-color:var(--ok);color:var(--ok)}
.obs-in{width:100%;min-height:76px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;resize:vertical;line-height:1.4}
.mbar{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line)}
.mbar:first-child{border-top:0}
.mbar .m{width:40px;flex:none;font-size:13px;font-weight:600;color:var(--muted);text-transform:capitalize}
.mbar .bar{flex:1;min-width:0;height:10px;border-radius:5px;background:var(--sunken);overflow:hidden}
.mbar .bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.mbar.cur .bar i{background:var(--ok)}
.mbar b{font-family:var(--f-display);font-weight:600;font-size:15px;min-width:92px;text-align:right;white-space:nowrap}

/* aviso de pagos del mes (desde el 19) */
.dues{border:2px solid var(--warn);background:var(--warn-soft);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.dues-h{display:flex;align-items:center;gap:10px}
.dues-h svg{width:28px;height:28px;flex:none;stroke:var(--warn);fill:none;stroke-width:2}
.dues-h b{display:block;font-family:var(--f-display);font-size:20px;font-weight:700;color:var(--warn);line-height:1.1}
.dues-h small{display:block;font-size:13px;color:var(--ink)}
.dues-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dues-item{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-weight:600;cursor:pointer;min-width:0}
.dues-item.done span{text-decoration:line-through;color:var(--muted)}
.dues.late{border-color:var(--danger);background:var(--danger-soft)}
.dues.late .dues-h b{color:var(--danger)}.dues.late .dues-h svg{stroke:var(--danger)}
@media (prefers-reduced-motion:no-preference){.dues{animation:glow 1.8s ease-in-out infinite}.dues.late{animation-name:glowLate}
  @keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(237,140,40,0)}50%{box-shadow:0 0 16px 3px rgba(237,140,40,.6)}}
  @keyframes glowLate{0%,100%{box-shadow:0 0 0 0 rgba(220,60,50,0)}50%{box-shadow:0 0 16px 3px rgba(220,60,50,.6)}}}

/* aviso flotante */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}

<script>
/* ===================== Datos base ===================== */
/* Cómo se ve cada trabajo: la etapa Presupuesto se separa en Por presupuestar (sin importe) y Presupuesto enviado (con importe). */
const PHASES=['Por presupuestar','Presupuesto enviado','Medición','Planos y notas','Libro digital / Previa','Correcciones','Aprobado','Entrega de documentación','Terminado'];
const STAGES=['Presupuesto','Medición','Planos y notas','Libro digital / Previa','Correcciones','Aprobado','Entrega de documentación','Terminado'];
const NEXT_LABEL={'Presupuesto':'Presupuesto aceptado → Medición','Medición':'Terminé medición → Planos y notas','Planos y notas':'Terminé notas → Previa','Libro digital / Previa':'Previa lista → Correcciones','Correcciones':'Correcciones hechas → Aprobado','Aprobado':'Documentación lista → Entrega','Entrega de documentación':'Entregué documentación → Terminado'};
const STAGE_MSG={
  'Libro digital / Previa':'El expediente se encuentra en etapa de previa en el Colegio de Agrimensores / Catastro de la provincia de Santa Fe.',
  'Correcciones':'Catastro devolvió el expediente al profesional para realizar las correcciones correspondientes.',
  'Aprobado':'El expediente fue aprobado. Resta preparar la documentación para entregar al cliente.'
};
const DOWL=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function clientMsg(j){
  const d=due(j),saldo=d>0?` Queda un saldo pendiente de ${money(d)}.`:'',tipo=j.type?` de ${j.type}`:'';
  const fd=pdate(j.fieldDate);
  switch(j.stage){
    case 'Presupuesto':return Number(j.budget)>0?`Le paso el presupuesto del trabajo${tipo}: ${money(j.budget)}. Quedo a disposición por cualquier consulta.`:'';
    case 'Medición':return fd?`Le confirmo que la medición está prevista para el ${DOWL[fd.getDay()]} ${fd.getDate()}/${fd.getMonth()+1}.`:'El trabajo está en etapa de medición. En breve coordinamos el día para ir al lugar.';
    case 'Planos y notas':return 'Ya hicimos la medición. Ahora estamos preparando los planos y las notas del expediente.';
    case 'Aprobado':return STAGE_MSG['Aprobado']+saldo;
    case 'Entrega de documentación':return 'La documentación del trabajo ya está lista para entregarle.'+saldo;
    case 'Terminado':return d>0?`Le recuerdo que queda un saldo pendiente de ${money(d)} por el trabajo${tipo}.`:'';
    default:return STAGE_MSG[j.stage]||'';
  }
}
/* Teléfono argentino a formato WhatsApp (54 9 + característica + número, sin 0 ni 15). */
function waNum(p){
  let d=String(p||'').replace(/\D/g,'');if(!d)return '';
  if(d.startsWith('549'))return d;if(d.startsWith('54'))d=d.slice(2);
  d=d.replace(/^0/,'');
  if(d.length===12)for(const k of [4,3,2])if(d.substr(k,2)==='15'){d=d.slice(0,k)+d.slice(k+2);break}
  return d.length===10?'549'+d:d;
}
const ICON_PHONE='<svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>';
const ICON_WA='<svg viewBox="0 0 24 24"><path d="M3 21l1.7-5A8.5 8.5 0 1 1 8 19.3z"/></svg>';
function waLink(j,text){const n=waNum(j.phone);return n?'https://wa.me/'+n+(text?'?text='+encodeURIComponent(text):''):''}
const WORK_TYPES=['Mensura','Mensura y subdivisión','Mensura para prescripción adquisitiva','Mensura rural','Mensura rural y subdivisión','Tasación','VEP','REP'];
const DEFAULT_EXPENSES={'Aporte Colegio':71000,'Aporte Caja':127800,'TRS — Tasa de Servicios':25000,'Gestoría — Alejandro':50000,'Certificado Catastral Urgente — CCU':0,'Fotocopia de ficha':25000};
const MENSURA=['Aporte Colegio','Aporte Caja','Gestoría — Alejandro','TRS — Tasa de Servicios','Fotocopia de ficha'];
const DEFAULT_MAP={'Mensura':MENSURA,'Mensura y subdivisión':MENSURA,'Mensura para prescripción adquisitiva':MENSURA,'Mensura rural':MENSURA,'Mensura rural y subdivisión':MENSURA,'Tasación':[],'VEP':['Aporte Caja','Aporte Colegio','Certificado Catastral Urgente — CCU'],'REP':[]};
const LOCAL_KEY='gestion_agrimensor_local_v1';
/* Pagos fijos de cada mes: se avisan desde el día 19 hasta marcarlos como pagados. */
const DUES=[['mono','Monotributo'],['rpi','RPI']];const DUE_DAY=19;const DUES_FROM='2026-10';

function defaultSettings(){return {expenses:{...DEFAULT_EXPENSES},mapping:JSON.parse(JSON.stringify(DEFAULT_MAP)),workTypes:[...WORK_TYPES],receiptNext:1,profName:'Ingeniero Agrimensor Nicolas Diaz',city:'Villa Ocampo',payTerms:'50% al aceptar el presupuesto y el saldo a la entrega de la documentación.'}}

let jobs=[],tasks=[],settings=defaultSettings();
let db=null,cloudReady=false,localPending=null;
const ui={view:'home',filter:'active',q:'',sheet:null,moreOpen:false,form:{}};

/* ===================== Utilidades ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',minimumFractionDigits:0,maximumFractionDigits:2}).format(Number(n)||0);
function parseMoney(v){let s=String(v??'').trim().replace(/[^0-9,.-]/g,'');if(!s)return 0;const neg=s.startsWith('-');s=s.replace(/-/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/\./g,'');const n=Number(s)||0;return neg?-n:n}
function fmtMoneyInput(el){let raw=String(el.value||'').replace(/[^0-9,]/g,'');if(!raw){el.value='';return}let [i,d]=raw.split(',');i=(i||'0').replace(/^0+(?=\d)/,'').replace(/\B(?=(\d{3})+(?!\d))/g,'.');el.value='$ '+i+(d!==undefined?','+d.slice(0,2):'')}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtDate=s=>{if(!s)return '—';const m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[3]}/${m[2]}/${m[1]}`:String(s)};
const due=j=>Math.max(0,(Number(j.budget)||0)-(Number(j.paid)||0));
const pendExp=j=>(j.expenses||[]).filter(e=>!e.paid).reduce((a,e)=>a+(Number(e.amount)||0),0);
const stIdx=s=>Math.max(0,STAGES.indexOf(s));
const phaseOf=j=>j.stage==='Presupuesto'?(Number(j.budget)>0?'Presupuesto enviado':'Por presupuestar'):j.stage;
const phIdx=p=>Math.max(0,PHASES.indexOf(p));
const phCls=p=>'st'+phIdx(p);
const jCls=j=>phCls(phaseOf(j));
const isActive=j=>j.stage!=='Terminado'||due(j)>0;
const toMeasure=j=>j.stage==='Presupuesto'||j.stage==='Medición';
const pdate=s=>{const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const weekStart=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return addDays(x,-((x.getDay()+6)%7))};
const DOW=['dom','lun','mar','mié','jue','vie','sáb'];
const fmtDay=s=>{const d=pdate(s);return d?`${DOW[d.getDay()]} ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`:'—'};
const uid=()=>Date.now().toString()+Math.random().toString(36).slice(2,5);
const docId=id=>String(id).replace(/[^A-Za-z0-9_\-.~:@+]/g,'_').replace(/^\.+$/,'_')||'_';
const daysSince=iso=>iso?Math.floor((Date.now()-new Date(iso).getTime())/864e5):null;
const getJob=id=>jobs.find(j=>String(j.id)===String(id));
const workTypes=()=>Array.from(new Set([...(settings.workTypes||[]),...jobs.map(j=>j.type).filter(Boolean)]));
const expensesForType=t=>(settings.mapping[t]||[]).map(name=>({name,amount:Number(settings.expenses[name]||0),paid:false}));
/* Partida inmobiliaria: 16 números con formato 03-08-00 514819/0001 */
function fmtPartida(v){const d=String(v||'').replace(/\D/g,'').slice(0,16);let o='';for(let i=0;i<d.length;i++){if(i===2||i===4)o+='-';else if(i===6)o+=' ';else if(i===12)o+='/';o+=d[i]}return o}
const partidaDigits=v=>String(v||'').replace(/\D/g,'');
const looksPartida=v=>/^[\d\s\-\/.]+$/.test(String(v||'').trim())&&partidaDigits(v).length===16;
const obsOf=j=>j.obs!==undefined?String(j.obs||''):(j.loc&&!looksPartida(j.loc)?'Ubicación: '+j.loc:'');
const ICON_CHEV='<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>';

function normJob(j){
  let stage=String(j.stage||'Presupuesto').trim();
  if(stage==='Contacto')stage='Presupuesto';
  if(stage==='Libro digital/Previa')stage='Libro digital / Previa';
  if(!STAGES.includes(stage))stage='Presupuesto';
  const budget=typeof j.budget==='number'?j.budget:parseMoney(j.budget);
  const paid=typeof j.paid==='number'?j.paid:parseMoney(j.paid);
  /* Partidas viejas guardadas en Ubicación pasan a su campo. */
  const partida=j.partida?fmtPartida(j.partida):looksPartida(j.loc)?fmtPartida(j.loc):'';
  const loc=!j.partida&&looksPartida(j.loc)?'':j.loc;
  return {...j,partida,loc,id:String(j.id||uid()),stage,budget:budget||0,paid:paid||0,priority:+j.priority||2,
    expenses:Array.isArray(j.expenses)?j.expenses:expensesForType(j.type),tasks:Array.isArray(j.tasks)?j.tasks:[],payments:Array.isArray(j.payments)?j.payments:[]};
}
function normSettings(s){
  const d=defaultSettings();s=s||{};
  return {...d,...s,expenses:{...(s.expenses||d.expenses)},mapping:{...(s.mapping||d.mapping)},workTypes:Array.isArray(s.workTypes)&&s.workTypes.length?[...s.workTypes]:d.workTypes,receiptNext:Number(s.receiptNext)||1};
}
function ensureReceiptNext(){let max=0;jobs.forEach(j=>(j.payments||[]).forEach(p=>{const n=Number(p.receiptNumber);if(Number.isFinite(n))max=Math.max(max,n)}));if(settings.receiptNext<=max)settings.receiptNext=max+1}

/* ===================== Guardado ===================== */
function readLocal(){try{return JSON.parse(localStorage.getItem(LOCAL_KEY)||'null')}catch(e){return null}}
function writeLocal(){try{localStorage.setItem(LOCAL_KEY,JSON.stringify({jobs,settings,tasks}))}catch(e){}}
const clean=o=>JSON.parse(JSON.stringify(o));
let writeQ=Promise.resolve(),pendingWrites=0,lastFailAt=0;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function fail(code){if(Date.now()-lastFailAt<1500)return;lastFailAt=Date.now();toast('No se pudo guardar'+(code?' ('+code+')':'')+'. Revisá la conexión y probá de nuevo.')}
const withTimeout=pr=>Promise.race([pr,new Promise((_,rej)=>setTimeout(()=>rej({code:'unavailable'}),15000))]);
async function attempt(fn,n){
  try{await withTimeout(fn())}
  catch(e){const c=e&&e.code;if(['resource_exhausted','unavailable','rate_limited'].includes(c)&&n<5){await sleep(500*(n+1));return attempt(fn,n+1)}fail(c);throw e}
}
/* Todas las escrituras pasan de a una, en orden, con reintento. */
function queueWrite(fn){
  pendingWrites++;setSaveState();
  const p=writeQ.then(()=>attempt(fn,0));

/* Cambios propios que la nube todavía no confirmó: una copia vieja que llegue mientras tanto no los pisa. */
const pend={jobs:new Map(),tasks:new Map(),deleted:new Set()};
let stampN=0;const stamp=()=>new Date().toISOString().slice(0,19)+'.'+String(Date.now()%1000).padStart(3,'0')+String(++stampN%1000).padStart(3,'0')+'Z';
function putDoc(kind,obj){
  obj.updatedAt=stamp();const id=docId(obj.id),body=clean(obj),st=obj.updatedAt;
  pend[kind].set(id,obj);pend.deleted.delete(kind+'/'+id);
  queueWrite(()=>db.doc(kind+'/'+id).set(body)).then(()=>{if(pend[kind].get(id)&&pend[kind].get(id).updatedAt===st)pend[kind].delete(id)}).catch(()=>{});
}
function delDoc(kind,obj){
  const id=docId(obj.id);pend[kind].delete(id);pend.deleted.add(kind+'/'+id);
  queueWrite(()=>db.doc(kind+'/'+id).delete()).then(()=>pend.deleted.delete(kind+'/'+id)).catch(()=>{});
}
function mergeSnap(kind,current,docs,norm){
  const byId=new Map(current.map(o=>[docId(o.id),o]));
  const out=new Map();
  docs.forEach(d=>{const sv=norm(clean(d.data()||{}));if(!sv.id)return;const id=docId(sv.id);if(pend.deleted.has(kind+'/'+id))return;
    const mine=byId.get(id);out.set(id,mine&&String(mine.updatedAt||'')>String(sv.updatedAt||'')?mine:sv)});
  pend[kind].forEach((o,id)=>{if(!out.has(id)||String(out.get(id).updatedAt||'')<String(o.updatedAt||''))out.set(id,o)});
  return [...out.values()];
}

async function connect(){
  let d=null;
  try{if(window.claude&&claude.use)d=await claude.use('db')}catch(e){d=null}
  if(!d){setSaveState();return}
  db=d;setSaveState();
  const local=readLocal();
  let firstJobs=true;
  db.collection('jobs').onSnapshot(snap=>{
    jobs=mergeSnap('jobs',jobs,snap.docs,normJob);
    if(firstJobs&&!snap.metadata.fromCache){firstJobs=false;cloudReady=true;setSaveState();
      if(!jobs.length&&local&&Array.isArray(local.jobs)&&local.jobs.length)localPending=local}
    refresh(true);
  },()=>{toast('Se cortó la conexión con la nube. Recargá la página.')});
  db.collection('tasks').onSnapshot(snap=>{tasks=mergeSnap('tasks',tasks,snap.docs,t=>t);refresh(true)},()=>{});
  db.doc('app/settings').onSnapshot(snap=>{const sv=normSettings(snap.exists?clean(snap.data()):null);
    if(settingsPend||String(settings.updatedAt||'')>String(sv.updatedAt||''))return;settings=sv;refresh(true)},()=>{});

function duesPeriod(){
  const t=new Date(),cur=ymd(t).slice(0,7);
  if(t.getDate()>=DUE_DAY)return cur;
  const prev=ymd(new Date(t.getFullYear(),t.getMonth()-1,1)).slice(0,7);
  if(prev<DUES_FROM)return null;
  const paid=(settings.duesPaid||{})[prev]||[];
  return DUES.some(([k])=>!paid.includes(k))?prev:null;
}

  if(s.kind==='job'){const j=getJob(s.id);if(!j){closeSheet();return}html=jobSheet(j)}
  else if(s.kind==='form')html=formSheet(s);
  else if(s.kind==='payment')html=paymentSheet(s);
  else if(s.kind==='expense')html=expenseSheet(s);
  else if(s.kind==='config')html=configSheet();
  else if(s.kind==='budgetpdf')html=budgetPdfSheet(s);
  $('#sheetRoot').innerHTML=`<div class="sheet-bg" data-act="bg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const sh=$('#sheetRoot .sheet');if(sh)sh.scrollTop=y;
  document.querySelectorAll('#sheetRoot .money-in').forEach(el=>{el.addEventListener('input',()=>fmtMoneyInput(el))});
}

    <div class="sub">Inicio ${fmtDate(j.start)}${j.phone?` · Tel. <span style="user-select:all">${esc(j.phone)}</span>`:''}${j.priority===1?' · <span class="hi">Prioridad alta</span>':''}</div>
    ${j.phone?`<div class="contact"><a href="tel:${esc(String(j.phone).replace(/[^0-9+]/g,''))}">${ICON_PHONE}Llamar</a>${waLink(j)?`<a class="wa" href="${esc(waLink(j))}" target="_blank" rel="noopener">${ICON_WA}WhatsApp</a>`:''}</div>`:''}</div>${closeBtn}</div><div class="sheet-body">`;

  if(toMeasure(j)){
    const t=new Date();const ws=weekStart(t);
    const opts=[['Mañana',ymd(addDays(t,1))],['Lunes que viene',ymd(addDays(ws,7))],['Miércoles que viene',ymd(addDays(ws,9))],['Viernes que viene',ymd(addDays(ws,11))]];
    h+=`<div class="panel meas-box"><div class="meas-top"><div><small>Medición prevista</small><b>${pdate(j.fieldDate)?fmtDay(j.fieldDate)+' '+pdate(j.fieldDate).getFullYear():'Sin fecha'}</b></div>

      <div class="tog">${opts.map(([l,d])=>`<button data-act="setfield" data-id="${esc(j.id)}" data-d="${d}" aria-pressed="${j.fieldDate===d}">${l} <span class="num">${fmtDay(d).split(' ')[1]}</span></button>`).join('')}${j.fieldDate?`<button data-act="setfield" data-id="${esc(j.id)}" data-d="">Quitar fecha</button>`:''}</div>${calStatusHtml(j)}</div>`;
  }
  if(j.stage==='Presupuesto'&&!(Number(j.budget)>0)){
    h+=`<form class="panel form" style="padding:12px" data-form="budget" data-id="${esc(j.id)}"><div class="field"><label for="budgetIn">Importe del presupuesto</label><input id="budgetIn" class="money-in num" inputmode="decimal" placeholder="$ 0"></div><button class="btn primary full" type="submit">Guardar presupuesto</button></form>`;
  } else if(j.stage!=='Terminado'){
    if(j.stage==='Presupuesto')h+=`<button class="btn full" data-act="budgetpdf" data-id="${esc(j.id)}">Presupuesto en PDF para el cliente</button>`;
    h+=`<button class="btn primary full" data-act="advance" data-id="${esc(j.id)}">${esc(NEXT_LABEL[j.stage])}</button>`;
  } else {
    h+=d>0?`<div class="note warn"><b>Terminado, falta cobrar ${money(d)}.</b> Cuando registres el cobro total queda finalizado.</div>`:`<div class="note ok"><b>Trabajo finalizado y cobrado.</b></div>`;
  }
  if(d>0&&(j.stage==='Aprobado'||j.stage==='Entrega de documentación'))h+=`<div class="note warn">Falta cobrar <b>${money(d)}</b>.</div>`;

  h+=`<div class="block"><div class="label"><label for="obsIn">Observaciones especiales</label></div><textarea id="obsIn" class="obs-in" data-obs="${esc(j.id)}" placeholder="Algo específico de este trabajo…">${esc(obsOf(j))}</textarea></div>`;

  h+=`<div class="block"><div class="label">Plata</div><div class="panel money3">
    <div><small>Presupuesto</small><b class="num">${money(j.budget)}</b></div>
    <div><small>Cobrado</small><b class="num">${money(j.paid)}</b></div>

    <div class="rows">${(j.payments||[]).map((p,k)=>`<div class="row"><div class="main tapzone" data-act="editpay" data-id="${esc(j.id)}" data-k="${k}" style="cursor:pointer"><div class="t1 num">${money(p.amount)}</div><div class="t2">${fmtDate(p.date)}${p.method?' · '+esc(p.method):''}${p.receiptNumber?' · Recibo '+esc(p.receiptNumber):''}</div></div><button class="small-act" data-act="receipt" data-id="${esc(j.id)}" data-k="${k}">Recibo PDF</button></div>`).join('')}

  const exps=j.expenses||[];const pe=pendExp(j);const te=exps.reduce((a,e)=>a+(Number(e.amount)||0),0);

    <div class="add-line"><button class="link" data-act="addexp" data-id="${esc(j.id)}">+ Agregar gasto</button></div></div></div>`;

  const ts=j.tasks||[];const tp=ts.filter(t=>!t.done),td=ts.filter(t=>t.done);
  h+=`<div class="block"><div class="label">Tareas de este trabajo <span class="count">${tp.length?tp.length+' pendiente'+(tp.length>1?'s':''):''}</span></div><div class="rows">

  </div></div>`;

  const msg=clientMsg(j),wl=waLink(j,msg);
  if(msg)h+=`<div class="block"><div class="label">Mensaje para el cliente</div><div class="msg" id="stageMsg">${esc(msg)}</div><div class="btn-row"><button class="btn" data-act="copymsg">Copiar mensaje</button>${wl?`<a class="btn wa" href="${esc(wl)}" target="_blank" rel="noopener">Enviar por WhatsApp</a>`:''}</div></div>`;

  h+=`<div class="block"><button class="btn full" data-act="more">${ui.moreOpen?'Menos opciones':'Más opciones'}</button><div class="more ${ui.moreOpen?'open':''}">
    <button class="btn full" data-act="edit" data-id="${esc(j.id)}">Modificar datos del trabajo</button>

function advance(j){
  const i=stIdx(j.stage);
  if(j.stage==='Presupuesto'&&!(Number(j.budget)>0)){toast('Primero cargá el presupuesto.');return}
  if(i<STAGES.length-1){j.stage=STAGES[i+1];j.stageAt=new Date().toISOString();saveJob(j);toast('Pasó a '+j.stage)}
}
function back(j){const i=stIdx(j.stage);if(i>0){j.stage=STAGES[i-1];j.stageAt=new Date().toISOString();saveJob(j);toast('Volvió a '+j.stage)}}

/* ===================== Google Calendar ===================== */
const CAL='Google Calendar';
let mcp=null,mcpChecked=false;const calBusy=new Set();const calErr={};
async function getMcp(){if(mcpChecked)return mcp;try{mcp=await claude.use('mcp')}catch(e){mcp=null}mcpChecked=true;return mcp}
const calOn=()=>settings.calSync!==false;
function calMsg(e){const c=e&&e.code;
  if(c==='server_not_connected'||c==='server_not_found'||c==='selection_required')return 'Google Calendar no está conectado. Conectalo en claude.ai → Configuración → Conectores.';
  if(c==='needs_reauth')return 'Hay que volver a conectar Google Calendar en claude.ai → Configuración → Conectores.';
  if(c==='not_in_manifest'||c==='approval_required'||c==='consent_required')return 'La app no tiene permiso para usar tu calendario. Tocá Agendar y aceptá el permiso.';
  if(c==='blocked_by_policy')return 'Tu organización no permite usar Google Calendar desde acá.';
  if(c==='tool_error')return 'Google Calendar rechazó el evento: '+String(e.message||'').slice(0,120);
  if(c==='not_granted'||c==='capability_disabled'||c==='capability_removed')return 'El calendario no está disponible en esta vista.';
  return 'No se pudo confirmar con Google Calendar. Revisá tu calendario antes de reintentar.';}
const nextDay=d=>ymd(addDays(pdate(d),1));
function calEvent(j){
  const desc=[j.type,j.exp?'Exp. '+j.exp:'',j.partida?'Partida: '+j.partida:'',j.phone?'Tel. '+j.phone:'',obsOf(j)?'Obs.: '+obsOf(j):'','Cargado desde Gestión Agrimensor.'].filter(Boolean).join('\n');
  return {summary:'Medir: '+j.client+(j.type?' — '+j.type:''),startTime:j.fieldDate+'T00:00:00-03:00',endTime:nextDay(j.fieldDate)+'T00:00:00-03:00',allDay:true,
    timeZone:'America/Argentina/Buenos_Aires',location:'',description:desc,notificationLevel:'NONE'};
}
const calSynced=j=>!!(j.fieldDate&&j.calEventId&&j.calDate===j.fieldDate&&j.calSig===calSig(j));
const calSig=j=>[j.client,j.type,j.exp,j.phone,j.partida||'',obsOf(j)].join('|');
/* Se llama solo después de una acción del usuario (nunca en automático). */
async function calSync(id,{quiet}={}){
  if(!calOn())return;const m=await getMcp();if(!m)return;
  let j=getJob(id);if(!j||calBusy.has(id))return;
  if(!j.fieldDate&&!j.calEventId)return;
  if(j.fieldDate&&calSynced(j))return;
  calBusy.add(id);delete calErr[id];refresh();
  try{
    if(!j.fieldDate){
      try{await m.callTool(CAL,'delete_event',{eventId:j.calEventId,notificationLevel:'NONE'})}catch(e){if(!(e&&e.code==='tool_error'))throw e}
      j=getJob(id);if(j){delete j.calEventId;delete j.calDate;delete j.calSig;saveJob(j)}
      if(!quiet)toast('Evento quitado del calendario');
    } else {
      const ev=calEvent(j);let newId=null;
      if(j.calEventId){
        try{const r=await m.callTool(CAL,'update_event',{eventId:j.calEventId,...ev});newId=(r.payload&&r.payload.id)||j.calEventId}
        catch(e){if(e&&e.code==='tool_error')newId=null;else throw e}  /* el evento ya no existe: se crea de nuevo */
      }
      if(!newId){const r=await m.callTool(CAL,'create_event',{...ev,availability:'AVAILABILITY_FREE'});newId=r.payload&&r.payload.id;if(!newId)throw {code:'upstream_error'}}
      const jj=getJob(id);if(jj){jj.calEventId=newId;jj.calDate=ev.startTime.slice(0,10);jj.calSig=calSig(jj);saveJob(jj)}
      if(!quiet)toast('Agendado en Google Calendar');
    }
  }catch(e){calErr[id]=calMsg(e);if(!quiet)toast(calErr[id])}
  finally{calBusy.delete(id);refresh()}
}
async function calSyncAll(){
  const list=jobs.filter(j=>toMeasure(j)&&j.fieldDate&&!calSynced(j));
  if(!list.length){toast('Todas las mediciones ya están en el calendario');return}
  let ok=0;for(const j of list){await calSync(j.id,{quiet:true});if(calSynced(getJob(j.id)||{}))ok++;else break}
  toast(ok===list.length?`${ok} medición${ok>1?'es':''} agendada${ok>1?'s':''}`:(calErr[list[ok]&&list[ok].id]||'No se pudieron agendar todas'));
}
function calStatusHtml(j){
  if(!calOn()||!mcp)return '';
  if(calBusy.has(String(j.id)))return `<div class="cal-st">Actualizando Google Calendar…</div>`;
  if(calErr[j.id])return `<div class="cal-st err">${esc(calErr[j.id])} <button class="link" data-act="calsync" data-id="${esc(j.id)}">Reintentar</button></div>`;
  if(j.fieldDate&&calSynced(j))return `<div class="cal-st ok">En tu Google Calendar</div>`;
  if(j.fieldDate)return `<div class="cal-st">No está en tu calendario. <button class="link" data-act="calsync" data-id="${esc(j.id)}">Agendar</button></div>`;
  return '';
}

async function saveFile(filename,data){
  let dl=null;try{dl=await claude.use('downloads')}catch(e){}
  if(dl){try{await dl.save({filename,data});return true}catch(e){if(e&&e.code==='declined')return false;toast('No se pudo descargar el archivo.');return false}}
  try{const blob=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);return true}catch(e){toast('No se pudo descargar el archivo.');return false}
}

/* Importe en letras: "ciento cincuenta mil con 00/100" */
function enLetras(n){
  const U=['','un','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiún','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
  const D=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
  const C=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
  const cien=x=>{if(x===0)return '';if(x===100)return 'cien';const c=Math.floor(x/100),r=x%100;let t=C[c];if(r){const dd=r<30?U[r]:D[Math.floor(r/10)]+(r%10?' y '+U[r%10]:'');t=(t?t+' ':'')+dd}return t};
  const ent=Math.floor(Math.abs(n)),cent=Math.round((Math.abs(n)-ent)*100);
  let txt;
  if(ent===0)txt='cero';
  else{const mill=Math.floor(ent/1e6),miles=Math.floor((ent%1e6)/1000),rest=ent%1000;const parts=[];
    if(mill)parts.push(mill===1?'un millón':cien(mill)+' millones');
    if(miles)parts.push(miles===1?'mil':cien(miles)+' mil');
    if(rest)parts.push(cien(rest));txt=parts.join(' ')}
  return txt+' con '+String(cent).padStart(2,'0')+'/100';
}

    off+=lh.length+nb.length+data.length});

}

function sheetXml(sh){
  const rows=sh.rows.map((r,ri)=>`<row r="${ri+1}">`+r.map((c,ci)=>{if(c==null||c==='')return '';const ref=colName(ci)+(ri+1);
    const o=typeof c==='object'?c:{v:c};const st=o.s?` s="${o.s}"`:'';
    if(o.f)return `<c r="${ref}"${st}><f>${xesc(o.f)}</f></c>`;
    if(typeof o.v==='number')return `<c r="${ref}"${st}><v>${o.v}</v></c>`;
    return `<c r="${ref}"${st} t="inlineStr"><is><t xml:space="preserve">${xesc(o.v)}</t></is></c>`}).join('')+`</row>`).join('');
  const cols=sh.cols?`<cols>${sh.cols.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols>`:'';
  const pane=sh.freeze?`<sheetViews><sheetView workbookViewId="0"><pane ySplit="${sh.freeze}" topLeftCell="A${sh.freeze+1}" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>`:'';
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${pane}${cols}<sheetData>${rows}</sheetData>${sh.filter?`<autoFilter ref="${sh.filter}"/>`:''}</worksheet>`;
}
function buildXlsx(sheets){
  const ns='http://schemas.openxmlformats.org/';
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="${ns}spreadsheetml/2006/main"><numFmts count="2"><numFmt numFmtId="164" formatCode="&quot;$&quot; #,##0"/><numFmt numFmtId="165" formatCode="dd/mm/yyyy"/></numFmts><fonts count="3"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="14"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE3EDF6"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="7"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="164" fontId="1" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  const files=[
    ['[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="${ns}package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`],
    ['_rels/.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${ns}package/2006/relationships"><Relationship Id="rId1" Type="${ns}officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ['xl/workbook.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="${ns}spreadsheetml/2006/main" xmlns:r="${ns}officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${xesc(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets>${sheets.some(s=>s.filter)?`<definedNames>${sheets.map((s,i)=>s.filter?`<definedName name="_xlnm._FilterDatabase" localSheetId="${i}" hidden="1">'${xesc(s.name)}'!${s.filter.split(':').map(x=>x.replace(/([A-Z]+)(\d+)/,'$$$1$$$2')).join(':')}</definedName>`:'').join('')}</definedNames>`:''}</workbook>`],
    ['xl/_rels/workbook.xml.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${ns}package/2006/relationships">${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="${ns}officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="${ns}officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
    ['xl/styles.xml',styles],
    ...sheets.map((s,i)=>[`xl/worksheets/sheet${i+1}.xml`,sheetXml(s)])
  ];
  return zipStore(files);
}
async function exportExcel(){
  const list=repJobs();const n=list.length;
  const M=v=>({v:Number(v)||0,s:2}),D=s=>{const x=xlDate(s);return x==null?'':{v:x,s:3}},Hd=v=>({v,s:1});
  const head=['Cliente','Tipo de trabajo','Expediente','Partida','Teléfono','Etapa','Estado','Prioridad','Inicio','Medición prevista','Presupuesto','Cobrado','A cobrar','Gastos total','Gastos pendientes','Tareas pendientes','Observaciones'].map(Hd);
  const rows=list.map(j=>[j.client,j.type,j.exp||'',j.partida||'',j.phone||'',j.stage,isActive(j)?'Activo':'Finalizado',['','Alta','Media','Baja'][j.priority]||'Media',D(j.start),toMeasure(j)?D(j.fieldDate):'',M(j.budget),M(j.paid),M(due(j)),M(expTot(j)),M(pendExp(j)),(j.tasks||[]).filter(t=>!t.done).map(t=>t.text).join(' · '),obsOf(j)]);
  const tot=n?[[{v:'Totales',s:6},'','','','','','','','','',...['K','L','M','N','O'].map(c=>({f:`SUM(${c}4:${c}${n+3})`,s:5})),'','']]:[];
  const s1={name:'Trabajos',rows:[[{v:`Estado de trabajos al ${fmtDate(today())}`,s:4}],[],head,...rows,...tot],cols:[28,22,14,22,14,22,11,9,11,13,14,14,14,14,14,40,50],freeze:3,filter:n?`A3:Q${n+3}`:null};
  const pays=[];list.forEach(j=>(j.payments||[]).forEach(p=>pays.push([j.client,j.type,D(p.date),M(p.amount),p.method||'',p.receiptNumber||''])));
  const s2={name:'Cobros',rows:[['Cliente','Tipo de trabajo','Fecha','Importe','Medio de pago','Recibo N.º'].map(Hd),...pays],cols:[28,22,11,14,16,10],freeze:1};
  const exs=[];list.forEach(j=>(j.expenses||[]).forEach(e=>exs.push([j.client,j.stage,e.name,M(e.amount),e.paid?'Pagado':'Pendiente'])));

  const ok=await saveFile(repName('xlsx'),buildXlsx([s1,s2,s3]));

function pdfAssemble(pages,W,H){
  const objs=['<< /Type /Catalog /Pages 2 0 R >>',null,
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique /Encoding /WinAnsiEncoding >>'];
  const kids=[];
  pages.forEach(st=>{const cIdx=objs.length+1;objs.push(`<< /Length ${st.length} >>\nstream\n${st}\nendstream`);const pIdx=objs.length+1;
    objs.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R >> >> /Contents ${cIdx} 0 R >>`);kids.push(pIdx+' 0 R')});
  objs[1]=`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${kids.length} >>`;
  let pdf='%PDF-1.4\n';const offs=[];
  objs.forEach((o,i)=>{offs.push(pdf.length);pdf+=`${i+1} 0 obj\n${o}\nendobj\n`});
  const x=pdf.length;
  pdf+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('');
  return pdf+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`;
}
function buildReport(){
  const W=842,H=595,L=34,R=W-34;
  const A='0.114 0.353 0.549',INK='0.09 0.13 0.16',MUT='0.40 0.45 0.48',SOFT='0.93 0.956 0.976',LINE='0.84 0.87 0.88';
  const pages=[];let c=null,y=0;
  const txt=(x,yy,s,size,font,col)=>c.push('BT',`/${font||'F1'} ${size} Tf`,`${col||INK} rg`,`${x.toFixed(1)} ${yy.toFixed(1)} Td`,pdfStr(s)+' Tj','ET');
  const rtxt=(x,yy,s,size,font,col)=>txt(x-textW(s,size,font==='F2'),yy,s,size,font,col);
  const rect=(x,yy,w,h,col)=>c.push(`${col} rg`,`${x} ${yy} ${w} ${h} re`,'f');
  const hline=(yy,col,w)=>c.push(`${w||0.4} w`,`${col||LINE} RG`,`${L} ${yy} m`,`${R} ${yy} l`,'S');
  const fit=(s,size,bold,w)=>{s=String(s||'');if(textW(s,size,bold)<=w)return s;while(s&&textW(s+'…',size,bold)>w)s=s.slice(0,-1);return s+'…'};
  const cols=[['Cliente',178,'l'],['Tipo',110,'l'],['Expediente',70,'l'],['Medición',52,'l'],['Presupuesto',72,'r'],['Cobrado',72,'r'],['A cobrar',72,'r'],['Gastos total',72,'r'],['Gastos pend.',76,'r']];
  const xs=[];let acc=L;cols.forEach(c0=>{xs.push(acc);acc+=c0[1]});
  const cell=(i,s,size,font,col)=>{const [,w,al]=cols[i];const v=fit(s,size,font==='F2',w-10);if(al==='r')rtxt(xs[i]+w-6,y,v,size,font,col);else txt(xs[i]+6,y,v,size,font,col)};
  const head=()=>{rect(L,y-6,R-L,18,SOFT);cols.forEach((c0,i)=>cell(i,c0[0].toUpperCase(),7,'F2',MUT));y-=18};
  const newPage=first=>{c=[];pages.push(c);rect(0,H-6,W,6,A);
    txt(L,H-34,'Estado de trabajos',first?18:11,'F2',INK);rtxt(R,H-34,(settings.profName||'')+' · '+fmtDate(today()),9,'F1',MUT);y=H-(first?60:52)};
  newPage(true);
  const act=jobs.filter(isActive);const tc=jobs.reduce((s,j)=>s+due(j),0);const tr=act.reduce((s,j)=>s+pendExp(j),0);
  const ym=today().slice(0,7);const month=jobs.reduce((s,j)=>s+(j.payments||[]).filter(p=>String(p.date||'').startsWith(ym)).reduce((a,p)=>a+(Number(p.amount)||0),0),0);
  [['Trabajos activos',String(act.length)],['A cobrar',money(tc)],['Gastos a reservar',money(tr)],['Cobrado este mes',money(month)]].forEach(([k,v],i)=>{
    const x=L+i*((R-L)/4);txt(x,y,k.toUpperCase(),7,'F2',MUT);txt(x,y-18,v,15,'F2',INK)});
  y-=44;hline(y+8,LINE,0.6);y-=10;
  const groups=[];repJobs().forEach(j=>{const g=isActive(j)?j.stage:'Finalizados';const f=groups.find(x=>x[0]===g);f?f[1].push(j):groups.push([g,[j]])});
  groups.forEach(([g,list])=>{
    if(y<110){newPage(false)}
    y-=6;txt(L,y,g+'  ('+list.length+')',10,'F2',A);y-=16;head();
    list.forEach(j=>{
      if(y<48){newPage(false);txt(L,y,g+' (continúa)',9,'F2',A);y-=16;head()}
      y-=2;const md=toMeasure(j)&&j.fieldDate?fmtDay(j.fieldDate):'';
      cell(0,j.client,8.5,'F2');cell(1,j.type,8.5);cell(2,j.exp||'—',8.5,'F1',MUT);cell(3,md,8.5);
      cell(4,money(j.budget),8.5);cell(5,money(j.paid),8.5);cell(6,due(j)?money(due(j)):'—',8.5,due(j)?'F2':'F1');cell(7,money(expTot(j)),8.5,'F1',MUT);cell(8,pendExp(j)?money(pendExp(j)):'—',8.5);
      hline(y-5);y-=15;
    });
    y-=8;
  });
  if(!jobs.length)txt(L,y,'No hay trabajos cargados.',10,'F1',MUT);
  const total=pages.length;
  return pdfAssemble(pages.map((pc,i)=>{c=pc;txt(L,22,'Gestión Agrimensor · documento de control interno',7.5,'F1',MUT);rtxt(R,22,`Página ${i+1} de ${total}`,7.5,'F1',MUT);return pc.join('\n')}),W,H);
}
async function exportPdfReport(){const ok=await saveFile(repName('pdf'),buildReport());if(ok)toast('PDF listo')}

async function receipt(j,k){
  const p=j.payments[k];if(!p)return;
  if(!p.receiptNumber){p.receiptNumber=nextReceipt();saveJob(j)}
  const r=buildReceipt(j,k);
  await saveFile(r.name,r.pdf);
}

let importData=null;
const BK_KEY='gestion_agrimensor_ultima_copia';
function backupDays(){let t=null;try{t=localStorage.getItem(BK_KEY)}catch(e){}return t?Math.max(0,Math.floor((Date.now()-new Date(t).getTime())/864e5)):null}
function markBackup(){try{localStorage.setItem(BK_KEY,new Date().toISOString())}catch(e){}setSaveState();refresh()}
/* La copia se manda al menú Compartir del celular: ahí se elige OneDrive y la carpeta. */
async function exportBackup(){
  const data={version:'Gestion Agrimensor V22',exportedAt:new Date().toISOString(),jobs,settings,tasks};
  const name='Gestion_Agrimensor_Copia_'+today()+'.json',txt=JSON.stringify(data,null,2);
  /* Android solo deja compartir ciertos tipos de archivo: la copia sale como .txt (adentro es la misma copia). */
  let file=null;try{file=new File([txt],name.replace(/\.json$/,'.txt'),{type:'text/plain'})}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:'Copia Gestión Agrimensor'});markBackup();toast('Copia guardada');return}
    catch(e){if(e&&e.name==='AbortError')return}
  }
  const ok=await saveFile(name,txt);if(ok){markBackup();toast('Copia descargada: guardala en OneDrive')}
}
function showImport(data){
  importData=data;const box=$('#importBox');if(!box)return;
  const n=data.jobs.length,t=(data.tasks||[]).length;
  const same=data.jobs.filter(j=>getJob(j.id)).length;
  box.innerHTML=`<div class="note info" style="display:flex;flex-direction:column;gap:8px"><div>La copia tiene <b>${n} trabajo${n===1?'':'s'}</b> y ${t} tarea${t===1?'':'s'} general${t===1?'':'es'}. Se suman a lo que ya tenés${same?`; ${same} ya existen y se reemplazan por los de la copia`:''}. También se toma la configuración de gastos y tipos de trabajo de la copia.</div>
    <div class="btn-row"><button class="btn primary" data-act="doimport">Importar</button><button class="btn" data-act="cancelimport">Cancelar</button></div></div>`;
}
async function doImport(data){
  const js=data.jobs.map(normJob);
  const ts=(data.tasks||[]).filter(t=>t&&t.id);
  settings=normSettings(data.settings);
  const map=new Map(jobs.map(j=>[String(j.id),j]));js.forEach(j=>map.set(String(j.id),j));jobs=[...map.values()];
  const tm=new Map(tasks.map(t=>[String(t.id),t]));ts.forEach(t=>tm.set(String(t.id),t));tasks=[...tm.values()];
  ensureReceiptNext();
  if(db){
    try{
      saveSettings();
      js.forEach(j=>putDoc('jobs',j));ts.forEach(t=>putDoc('tasks',t));
      await writeQ;
      if(pend.jobs.size||pend.tasks.size)throw 0;
    }catch(e){toast('La importación quedó a medias. Probá de nuevo con la misma copia.');refresh();return}
  } else writeLocal();
  importData=null;localPending=null;
  toast(`Listo: ${js.length} trabajo${js.length===1?'':'s'} importado${js.length===1?'':'s'}`);
  refresh();
}

/* ===================== Eventos ===================== */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,id=el.dataset.id,k=el.dataset.k!=null&&el.dataset.k!==''?+el.dataset.k:null;
  const j=id?getJob(id):null;
  switch(act){
    case 'tab':ui.view=el.dataset.v;renderView();window.scrollTo(0,0);break;
    case 'filter':ui.filter=el.dataset.f;ui.view='jobs';renderView();if(e.target.closest('.stages'))window.scrollTo(0,0);break;
    case 'open':openSheet({kind:'job',id});break;
    case 'new':openSheet({kind:'form'});break;
    case 'config':openSheet({kind:'config'});break;
    case 'close':closeSheet();break;
    case 'bg':if(e.target===el)closeSheet();break;
    case 'advance':if(j)advance(j);break;
    case 'back':if(j&&armed(el,'Tocá de nuevo para volver'))back(j);break;
    case 'more':ui.moreOpen=!ui.moreOpen;renderSheet();break;
    case 'edit':openSheet({kind:'form',id});break;
    case 'deljob':if(j&&armed(el,'Tocá de nuevo para eliminar')){closeSheet();const ev=j.calEventId;removeJob(j);toast('Trabajo eliminado');
      if(ev&&calOn())getMcp().then(m=>m&&m.callTool(CAL,'delete_event',{eventId:ev,notificationLevel:'NONE'}).catch(()=>{}))}break;
    case 'addpay':openSheet({kind:'payment',id,k:null});break;
    case 'editpay':openSheet({kind:'payment',id,k});break;
    case 'delpay':if(j&&armed(el,'Tocá de nuevo para eliminar')){const p=j.payments[k];j.paid=Math.max(0,(Number(j.paid)||0)-(Number(p.amount)||0));j.payments.splice(k,1);saveJob(j);openSheet({kind:'job',id});toast('Cobro eliminado')}break;
    case 'receipt':if(j)receipt(j,k);break;
    case 'exp':if(j&&j.expenses[k]){j.expenses[k].paid=el.checked;saveJob(j)}break;
    case 'addexp':openSheet({kind:'expense',id,k:null});break;
    case 'editexp':openSheet({kind:'expense',id,k});break;
    case 'delexp':if(j&&armed(el,'Tocá de nuevo para quitar')){j.expenses.splice(k,1);saveJob(j);openSheet({kind:'job',id})}break;
    case 'jobtask':{if(!j)break;const t=(j.tasks||[]).find(x=>String(x.id)===el.dataset.t);if(t){t.done=el.checked;t.completed=el.checked?new Date().toISOString():undefined;saveJob(j);if(el.checked)toast('Tarea hecha')}break}
    case 'deljobtask':if(j){j.tasks=j.tasks.filter(x=>String(x.id)!==el.dataset.t);saveJob(j)}break;
    case 'task':{const t=tasks.find(x=>String(x.id)===el.dataset.t);if(t){t.done=true;t.completed=new Date().toISOString();saveTask(t);toast('Tarea hecha')}break}
    case 'copymsg':{const txt=$('#stageMsg').textContent;const sel=()=>{const r=document.createRange();r.selectNodeContents($('#stageMsg'));const s=getSelection();s.removeAllRanges();s.addRange(r)};
      try{navigator.clipboard.writeText(txt).then(()=>toast('Mensaje copiado'),()=>{sel();toast('Texto seleccionado: copialo')})}catch(err){sel();toast('Texto seleccionado: copialo')}break}
    case 'setfield':if(j){j.fieldDate=el.dataset.d;saveJob(j);toast(el.dataset.d?'Medición: '+fmtDay(el.dataset.d):'Fecha quitada');calSync(j.id)}break;
    case 'calsync':if(j)calSync(j.id);break;
    case 'calall':calSyncAll();break;
    case 'budgetpdf':if(j){if(!(Number(j.budget)>0)){toast('Primero cargá el presupuesto.');break}openSheet({kind:'budgetpdf',id})}break;
    case 'fillsaldo':{const i=$('#pAmt');if(i){i.value=String(el.dataset.v).replace('.',',');fmtMoneyInput(i);i.focus()}break}
    case 'caltoggle':settings.calSync=!calOn();saveSettings();break;
    case 'duepaid':{const p=el.dataset.p,k=el.dataset.due;const all={...(settings.duesPaid||{})};const s=new Set(all[p]||[]);el.checked?s.add(k):s.delete(k);all[p]=[...s];settings.duesPaid=all;saveSettings();
      toast(DUES.every(([x])=>s.has(x))?'Pagos del mes al día':el.checked?(DUES.find(([x])=>x===k)||[,''])[1]+' pagado':'Marcado como pendiente');break}
    case 'export':exportBackup();break;
    case 'xlsx':exportExcel();break;
    case 'pdfrep':exportPdfReport();break;
    case 'import':$('#importFile').value='';$('#importFile').click();break;
    case 'doimport':if(importData)doImport(importData);break;
    case 'cancelimport':importData=null;$('#importBox').innerHTML='';break;
    case 'uplocal':if(localPending)doImport(localPending);break;
    case 'map':{const t=settings.workTypes[+el.dataset.i];const n=el.dataset.n;const cur=settings.mapping[t]||[];settings.mapping[t]=cur.includes(n)?cur.filter(x=>x!==n):[...cur,n];saveSettings();break}
    case 'deltype':{const t=settings.workTypes[+el.dataset.i];if(jobs.some(x=>x.type===t))break;if(armed(el,'¿Seguro?')){settings.workTypes.splice(+el.dataset.i,1);delete settings.mapping[t];saveSettings()}break}
    case 'delconcept':{const n=el.dataset.n;if(armed(el,'¿Seguro?')){delete settings.expenses[n];Object.keys(settings.mapping).forEach(t=>settings.mapping[t]=(settings.mapping[t]||[]).filter(x=>x!==n));saveSettings()}break}
  }
});

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.fieldDate!=null){const j=getJob(t.dataset.fieldDate);if(j){j.fieldDate=t.value;saveJob(j);if(t.value)toast('Medición: '+fmtDay(t.value));calSync(j.id)}return}
  if(t.dataset.obs!=null){const j=getJob(t.dataset.obs);if(j){const val=t.value.trim();if(val!==obsOf(j)||j.obs===undefined){j.obs=val;if(j.loc&&!looksPartida(j.loc))j.loc='';saveJob(j);toast('Observación guardada')}}return}
  if(t.dataset.expName!=null){const v=parseMoney(t.value);if(v>=0){settings.expenses[t.dataset.expName]=v;saveSettings();toast('Importe guardado')}}
  if(t.dataset.typeI!=null){const i=+t.dataset.typeI,old=settings.workTypes[i],name=t.value.trim();
    if(!name||settings.workTypes.some((x,k)=>k!==i&&x.toLowerCase()===name.toLowerCase())){t.value=old;toast(name?'Ese tipo ya existe':'El nombre no puede quedar vacío');return}
    if(name===old)return;settings.workTypes[i]=name;settings.mapping[name]=settings.mapping[old]||[];delete settings.mapping[old];
    jobs.filter(j=>j.type===old).forEach(j=>{j.type=name;saveJob(j)});saveSettings();toast('Tipo renombrado')}
});
$('#importFile').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.jobs))throw 0;showImport({jobs:d.jobs,tasks:Array.isArray(d.tasks)?d.tasks:[],settings:d.settings||null})}catch(err){toast('Ese archivo no es una copia de Gestión Agrimensor')}};
  r.readAsText(f);
});

document.addEventListener('submit',e=>{
  const f=e.target;if(!f.dataset.form)return;e.preventDefault();
  const v=id=>(document.getElementById(id)?.value||'').trim();
  const err=m=>{const el=$('#formErr');if(el)el.textContent=m;else toast(m)};
  const j=f.dataset.id?getJob(f.dataset.id):null;
  switch(f.dataset.form){
    case 'task':{const text=v('newTask');if(!text)return;$('#newTask').value='';const t={id:uid(),text,done:false,created:new Date().toISOString()};tasks.push(t);saveTask(t);setTimeout(()=>$('#newTask')?.focus(),0);break}
    case 'jobtask':{const text=v('newJobTask');if(!text||!j)return;j.tasks=j.tasks||[];j.tasks.unshift({id:uid(),text,done:false,created:new Date().toISOString()});saveJob(j);renderSheet();setTimeout(()=>$('#newJobTask')?.focus(),0);break}
    case 'quick':{if(!j)return;const inp=f.querySelector('input');const a=parseMoney(inp&&inp.value);if(!(a>0)){toast('Escribí el importe del presupuesto');inp&&inp.focus();return}if(inp)inp.value='';j.budget=a;saveJob(j);toast(j.client+': '+money(a)+' · pasa a Presupuesto enviado');break}
    case 'quicknew':{const client=v('qnClient'),type=v('qnType')||workTypes()[0]||'';if(!client){toast('Escribí el cliente o el lugar');$('#qnClient')?.focus();return}$('#qnClient').value='';
      const nj=normJob({id:Date.now().toString(),client,type,budget:0,priority:2,start:today(),stage:'Presupuesto',stageAt:new Date().toISOString(),paid:0,payments:[],tasks:[],expenses:expensesForType(type),obs:'',loc:'',phone:''});jobs.push(nj);saveJob(nj);toast('Anotado para presupuestar');setTimeout(()=>$('#qnClient')?.focus(),0);break}
    case 'budget':{const a=parseMoney(v('budgetIn'));if(!(a>0)){toast('Escribí un importe mayor a cero');return}j.budget=a;saveJob(j);toast('Presupuesto guardado');break}
    case 'job':{
      const client=v('fClient'),type=v('fType');if(!client){err('Falta el nombre del cliente.');return}
      const partida=fmtPartida(v('fPartida'));if(partida&&partidaDigits(partida).length!==16){err('La partida tiene que tener 16 números, así: 03-08-00 514819/0001.');return}
      const data={client,type,budget:parseMoney(v('fBudget')),priority:+v('fPrio')||2,exp:v('fExp'),start:v('fStart')||today(),fieldDate:v('fField'),partida,obs:(document.getElementById('fObs')?.value||'').trim(),loc:'',phone:v('fPhone')};
      if(j){const oldType=j.type;Object.assign(j,data);if(oldType!==type&&!(j.expenses||[]).length)j.expenses=expensesForType(type);saveJob(j);if(j.fieldDate||j.calEventId)calSync(j.id);openSheet({kind:'job',id:j.id});toast('Cambios guardados')}
      else{const nj=normJob({id:Date.now().toString(),...data,stage:'Presupuesto',stageAt:new Date().toISOString(),paid:0,payments:[],tasks:[],expenses:expensesForType(type)});jobs.push(nj);saveJob(nj);openSheet({kind:'job',id:nj.id});toast('Trabajo guardado');if(nj.fieldDate)calSync(nj.id)}
      break}
    case 'pay':{
      const a=parseMoney(v('pAmt'));if(!(a>0)){err('El importe tiene que ser mayor a cero.');return}
      const k=f.dataset.k!==''?+f.dataset.k:null;
      if(k==null&&a>due(j)+0.5&&f.dataset.over!==String(a)){f.dataset.over=String(a);err(`El importe supera lo que falta cobrar (${money(due(j))}). Tocá Guardar de nuevo para confirmar.`);return}
      if(k!=null){const p=j.payments[k];j.paid=Math.max(0,(Number(j.paid)||0)-(Number(p.amount)||0)+a);Object.assign(p,{amount:a,date:v('pDate'),method:v('pMethod')});saveJob(j);openSheet({kind:'job',id:j.id});toast('Cobro actualizado')}
      else{j.payments=j.payments||[];j.payments.push({amount:a,date:v('pDate')||today(),method:v('pMethod'),receiptNumber:nextReceipt()});j.paid=(Number(j.paid)||0)+a;saveJob(j);openSheet({kind:'job',id:j.id});toast('Cobro registrado');receipt(j,j.payments.length-1)}
      break}
    case 'exp':{
      const a=parseMoney(v('eAmt'));const k=f.dataset.k!==''?+f.dataset.k:null;
      if(k!=null){j.expenses[k].amount=a;saveJob(j);openSheet({kind:'job',id:j.id})}
      else{const name=v('eName');if(!name){err('Escribí el concepto.');return}j.expenses=j.expenses||[];j.expenses.push({name,amount:a,paid:false});saveJob(j);openSheet({kind:'job',id:j.id});toast('Gasto agregado')}
      break}
    case 'budgetpdf':{
      if(!j)return;const terms=v('bTerms');if(!terms){err('Escribí la forma de pago.');return}
      j.payTerms=terms;if(document.getElementById('bDefault')?.checked&&settings.payTerms!==terms){settings.payTerms=terms;saveSettings()}
      saveJob(j);const r=buildBudget(j,terms);
      saveFile(r.name,r.pdf).then(ok=>{if(ok)toast('Presupuesto listo')});openSheet({kind:'job',id:j.id});break}
    case 'concept':{const n=v('newConcept');if(!n)return;if(settings.expenses[n]!==undefined){toast('Ese gasto ya existe');return}settings.expenses[n]=0;saveSettings();setTimeout(()=>$('#newConcept')?.focus(),0);break}
    case 'type':{const n=v('newType');if(!n)return;if(settings.workTypes.some(x=>x.toLowerCase()===n.toLowerCase())){toast('Ese tipo ya existe');return}settings.workTypes.push(n);settings.mapping[n]=[];saveSettings();break}
    case 'receipt':{settings.profName=v('rName');settings.city=v('rCity');const n=parseInt(v('rNext'),10);if(n>0)settings.receiptNext=n;settings.payTerms=v('rTerms');ensureReceiptNext();saveSettings();toast('Datos guardados');break}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.sheet)closeSheet()});

window.addEventListener('error',e=>{toast('Algo falló: '+(e.message||'error')+'. Recargá la página y probá de nuevo.')});
window.addEventListener('unhandledrejection',e=>{const r=e.reason;if(r&&r.code)return;toast('Algo falló: '+((r&&r.message)||'error')+'.')});
/* ===================== Inicio ===================== */
(function init(){
  const l=readLocal();
  if(l){jobs=(l.jobs||[]).map(normJob);tasks=l.tasks||[];settings=normSettings(l.settings)}
  renderView();setSaveState();
  setTimeout(connect,0);
  setTimeout(()=>getMcp().then(()=>refresh(true)),0);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
})();
</script>
